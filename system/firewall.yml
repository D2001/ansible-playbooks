---
- name: Install guarded firewall management tools
  hosts: localhost
  become: true
  gather_facts: false
  tasks:
    - name: Ensure host tool directory exists
      ansible.builtin.file:
        path: /usr/local/lib/raspi
        state: directory
        owner: root
        group: root
        mode: '0755'
    - name: Install firewall policy and transaction tool
      ansible.builtin.copy:
        src: "files/{{ item }}"
        dest: "/usr/local/lib/raspi/{{ item }}"
        owner: root
        group: root
        mode: '0755'
      loop:
        - firewall-policy.py
        - firewall-transaction.py
    - name: Explain staged activation
      ansible.builtin.debug:
        msg: >-
          Run sudo python3 /usr/local/lib/raspi/firewall-transaction.py trial;
          verify LAN/VPN access, then use confirm within ten minutes or rollback.
          This playbook only installs the tools and does not change live rules.
