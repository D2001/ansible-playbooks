---
- name: Install the backed-up system update workflow
  hosts: localhost
  become: true
  gather_facts: false
  tasks:
    - name: Ensure scripts directory exists
      ansible.builtin.file:
        path: /home/karsten/scripts
        state: directory
        owner: karsten
        group: karsten
        mode: '0755'
    - name: Install update entry point
      ansible.builtin.copy:
        src: files/system-update.sh
        dest: /home/karsten/scripts/system-update.sh
        owner: karsten
        group: karsten
        mode: '0755'
        validate: /bin/bash -n %s
    - name: Read existing root schedule
      ansible.builtin.command: crontab -u root -l
      register: update_crontab
      changed_when: false
      failed_when: update_crontab.rc not in [0, 1]
    - name: Add midnight schedule only if no existing update entry exists
      ansible.builtin.cron:
        name: Backed-up system update
        user: root
        minute: '0'
        hour: '0'
        job: /home/karsten/scripts/system-update.sh >> /var/log/system-update.log 2>&1
        state: present
      when: "'/home/karsten/scripts/system-update.sh' not in update_crontab.stdout"
