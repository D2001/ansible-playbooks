---
- name: Install the backed-up system update workflow
  hosts: localhost
  become: true
  gather_facts: false
  tasks:
    - name: Ensure scripts directory exists
      ansible.builtin.file:
        path: /home/karsten/scripts
        state: directory
        owner: karsten
        group: karsten
        mode: '0755'
    - name: Install update entry point
      ansible.builtin.copy:
        src: files/system-update.sh
        dest: /home/karsten/scripts/system-update.sh
        owner: karsten
        group: karsten
        mode: '0755'
        validate: /bin/bash -n %s
    - name: Explain schedule ownership
      ansible.builtin.debug:
        msg: >-
          The update entry point is installed. system/schedules.yml owns its
          weekly systemd timer and the explicit one-time cron migration.
