[Unit]
# Docker's actual data root lives on USB. Never create a fallback on the SD card.
RequiresMountsFor=/mnt/usb
# Install the autofs trigger before Docker can auto-start Paperless. This does
# not require the NAS itself to be online, unlike requiring the CIFS mount.
Requires=mnt-paperless.automount
After=mnt-paperless.automount

[Service]
ExecStartPre=/usr/bin/mountpoint -q /mnt/usb
