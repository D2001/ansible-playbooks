---
- name: Reject restore modes that are not hardened yet
  ansible.builtin.fail:
    msg: >-
      restore_mode={{ restore_mode }} is disabled. Only the non-destructive
      restore_mode=validate is currently implemented.
  when: restore_mode != "validate"

- name: Validate restore backup without modifying production data
  ansible.builtin.import_tasks: validate_restore.yml
  when: restore_mode == "validate"
