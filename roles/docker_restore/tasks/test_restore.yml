---
- name: Restrict isolated restore test to Paperless
  ansible.builtin.assert:
    that:
      - service_name == "paperless"
    fail_msg: >-
      The isolated restore test currently supports only service_name=paperless.

- name: Perform isolated Paperless PostgreSQL restore test
  block:
    - name: Retain validated files until isolated test cleanup
      ansible.builtin.set_fact:
        restore_keep_validation_data: true

    - name: Select and fully validate backup before test restore
      ansible.builtin.include_tasks: validate_restore.yml

    - name: Generate isolated Docker object identifier
      ansible.builtin.set_fact:
        restore_test_id: >-
          {{ (restore_validation_temp.path | hash('sha1'))[0:12] }}

    - name: Define isolated Docker object names
      ansible.builtin.set_fact:
        restore_test_volume_name: >-
          paperless_restore_test_pgdata_{{ restore_test_id }}
        restore_test_container_name: >-
          paperless-restore-test-db-{{ restore_test_id }}

    - name: Read restored PostgreSQL Compose configuration safely
      ansible.builtin.shell: |
        set -euo pipefail

        python3 -           "{{ restore_validation_temp.path }}/extracted/{{ service_name }}/docker-compose.yml"           <<'PY'
        import json
        import os
        import re
        import subprocess
        import sys
        from pathlib import Path

        compose_file = Path(sys.argv[1]).resolve()
        compose_dir = compose_file.parent

        compose_result = subprocess.run(
            [
                "docker",
                "compose",
                "--project-directory",
                str(compose_dir),
                "-f",
                str(compose_file),
                "config",
                "--format",
                "json",
            ],
            cwd=compose_dir,
            text=True,
            capture_output=True,
            check=False,
        )

        if compose_result.returncode != 0:
            raise SystemExit(
                "Restored Docker Compose configuration "
                "could not be resolved"
            )

        compose_config = json.loads(compose_result.stdout)

        def normalize_environment(raw_environment):
            if isinstance(raw_environment, dict):
                return {
                    str(key): (
                        ""
                        if value is None
                        else str(value)
                    )
                    for key, value in raw_environment.items()
                }

            result = {}

            for entry in raw_environment or []:
                entry = str(entry)

                if "=" in entry:
                    key, value = entry.split("=", 1)
                    result[key] = value

            return result

        required_environment = {
            "POSTGRES_USER",
            "POSTGRES_DB",
            "POSTGRES_PASSWORD",
        }

        candidates = []

        for service_name, service in (
            compose_config.get("services") or {}
        ).items():
            image = str(service.get("image") or "").strip()
            environment = normalize_environment(
                service.get("environment")
            )

            if not image:
                continue

            if not required_environment.issubset(environment):
                continue

            if any(
                not environment[key]
                for key in required_environment
            ):
                continue

            pgdata = os.path.normpath(
                environment.get("PGDATA")
                or "/var/lib/postgresql/data"
            )

            matching_mounts = []

            for volume in service.get("volumes") or []:
                if not isinstance(volume, dict):
                    continue

                target = os.path.normpath(
                    str(volume.get("target") or "")
                )

                if not target.startswith("/"):
                    continue

                if (
                    pgdata == target
                    or pgdata.startswith(target.rstrip("/") + "/")
                ):
                    matching_mounts.append(volume)

            if len(matching_mounts) != 1:
                continue

            image_result = subprocess.run(
                ["docker", "image", "inspect", image],
                text=True,
                capture_output=True,
                check=False,
            )

            if image_result.returncode != 0:
                continue

            image_data = json.loads(image_result.stdout)[0]
            image_environment = normalize_environment(
                (image_data.get("Config") or {}).get("Env")
            )

            pg_major = image_environment.get(
                "PG_MAJOR",
                "",
            ).strip()

            if not pg_major:
                image_match = re.search(
                    r"(?:^|/)postgres:([0-9]+)(?:[-@]|$)",
                    image,
                )

                if image_match:
                    pg_major = image_match.group(1)

            if not pg_major:
                continue

            mount = matching_mounts[0]
            mount_target = os.path.normpath(
                str(mount.get("target") or "")
            )

            pgdata_relative = os.path.relpath(
                pgdata,
                mount_target,
            )

            if pgdata_relative == ".":
                pgdata_relative = ""

            if (
                pgdata_relative == ".."
                or pgdata_relative.startswith("../")
            ):
                continue

            candidates.append({
                "compose_service": service_name,
                "image": image,
                "postgres_user": environment[
                    "POSTGRES_USER"
                ],
                "postgres_db": environment[
                    "POSTGRES_DB"
                ],
                "postgres_password": environment[
                    "POSTGRES_PASSWORD"
                ],
                "pg_major": pg_major,
                "pgdata": pgdata,
                "mount_target": mount_target,
                "pgdata_relative": pgdata_relative,
                "volume_source": mount.get("source"),
            })

        if len(candidates) != 1:
            raise SystemExit(
                "Expected exactly one PostgreSQL service "
                "in the restored Compose configuration, "
                f"found {len(candidates)}"
            )

        print(json.dumps(candidates[0]))
        PY
      args:
        executable: /bin/bash
      register: restore_test_db_config_raw
      changed_when: false
      no_log: true

    - name: Store restored PostgreSQL configuration
      ansible.builtin.set_fact:
        restore_test_db_config: >-
          {{ restore_test_db_config_raw.stdout | from_json }}
      no_log: true

    - name: Read PostgreSQL metadata from archive
      ansible.builtin.shell: |
        set -euo pipefail

        python3 - "{{ final_backup_file }}" <<'PY'
        import json
        import sys
        import tarfile

        archive = sys.argv[1]
        root_name = (
            "volumes/paperless_paperless_pgdata"
        )
        version_name = root_name + "/PG_VERSION"

        root_member = None
        version_member = None

        with tarfile.open(archive, mode="r:gz") as tar:
            for member in tar.getmembers():
                normalized = member.name.rstrip("/")

                if normalized == root_name:
                    root_member = member

                if normalized == version_name:
                    version_member = member

            if root_member is None:
                raise SystemExit(
                    "Paperless PostgreSQL volume root is missing"
                )

            if version_member is None:
                raise SystemExit(
                    "Paperless PostgreSQL PG_VERSION is missing"
                )

            version_file = tar.extractfile(version_member)

            if version_file is None:
                raise SystemExit(
                    "Could not read PostgreSQL PG_VERSION"
                )

            pg_version = (
                version_file.read()
                .decode("ascii")
                .strip()
            )

        print(json.dumps({
            "uid": root_member.uid,
            "gid": root_member.gid,
            "mode": format(root_member.mode, "04o"),
            "pg_version": pg_version,
        }))
        PY
      args:
        executable: /bin/bash
      register: restore_test_archive_db_raw
      changed_when: false

    - name: Store archive PostgreSQL metadata
      ansible.builtin.set_fact:
        restore_test_archive_db: >-
          {{ restore_test_archive_db_raw.stdout | from_json }}

    - name: Validate PostgreSQL test compatibility
      ansible.builtin.assert:
        that:
          - restore_test_db_config.image | length > 0
          - restore_test_db_config.mount_target | length > 0
          - restore_test_db_config.pgdata | length > 0
          - >-
            restore_test_archive_db.pg_version | string ==
            restore_test_db_config.pg_major | string
          - >-
            restore_test_db_config.pgdata ==
            restore_test_db_config.mount_target
            or
            restore_test_db_config.pgdata.startswith(
              restore_test_db_config.mount_target.rstrip('/') ~ '/'
            )
          - >-
            restore_test_db_config.pgdata_relative == ""
            or
            (
              restore_test_db_config.pgdata_relative |
              regex_search(
                '^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$'
              )
            ) is not none
        fail_msg: >-
          The backup PostgreSQL version or PGDATA layout is incompatible with
          the PostgreSQL image declared by the restored Compose configuration.

    - name: Verify isolated container name is unused
      ansible.builtin.command:
        argv:
          - docker
          - container
          - inspect
          - "{{ restore_test_container_name }}"
      register: restore_test_existing_container
      changed_when: false
      failed_when: false

    - name: Verify isolated volume name is unused
      ansible.builtin.command:
        argv:
          - docker
          - volume
          - inspect
          - "{{ restore_test_volume_name }}"
      register: restore_test_existing_volume
      changed_when: false
      failed_when: false

    - name: Require unused isolated Docker object names
      ansible.builtin.assert:
        that:
          - restore_test_existing_container.rc != 0
          - >-
            'no such container' in
            (restore_test_existing_container.stderr | lower)
          - restore_test_existing_volume.rc != 0
          - >-
            'no such volume' in
            (restore_test_existing_volume.stderr | lower)
        fail_msg: >-
          Refusing to continue after unexpected Docker inspect result for
          generated restore-test objects.

    - name: Create isolated PostgreSQL test volume
      ansible.builtin.command:
        argv:
          - docker
          - volume
          - create
          - --label
          - "restore.test=true"
          - --label
          - "restore.test.service=paperless"
          - --label
          - "restore.test.backup={{ restore_selected_name }}"
          - "{{ restore_test_volume_name }}"
      register: restore_test_volume_create
      changed_when: true

    - name: Populate isolated PostgreSQL volume preserving ownership and modes
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --pull
          - never
          - --network
          - none
          - --label
          - "restore.test=true"
          - --entrypoint
          - /bin/sh
          - --mount
          - "type=bind,src={{ final_backup_file }},dst=/backup.tar.gz,readonly"
          - --mount
          - "type=volume,src={{ restore_test_volume_name }},dst=/restore"
          - --env
          - >-
            RESTORE_PGDATA_RELATIVE={{
              restore_test_db_config.pgdata_relative
            }}
          - "{{ restore_test_db_config.image }}"
          - -ec
          - |
            destination="/restore"

            if [ -n "$RESTORE_PGDATA_RELATIVE" ]; then
              destination="$destination/$RESTORE_PGDATA_RELATIVE"
            fi

            mkdir -p "$destination"

            tar \
              --extract \
              --gzip \
              --numeric-owner \
              --same-owner \
              --same-permissions \
              --file /backup.tar.gz \
              --directory "$destination" \
              --strip-components=2 \
              volumes/paperless_paperless_pgdata

            chown \
              {{ restore_test_archive_db.uid }}:{{ restore_test_archive_db.gid }} \
              "$destination"

            chmod \
              {{ restore_test_archive_db.mode }} \
              "$destination"

            test \
              "$(cat "$destination/PG_VERSION")" = \
              "{{ restore_test_archive_db.pg_version }}"
      changed_when: true

    - name: Start isolated PostgreSQL test container
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --detach
          - --pull
          - never
          - --name
          - "{{ restore_test_container_name }}"
          - --network
          - none
          - --label
          - "restore.test=true"
          - --label
          - "restore.test.service=paperless"
          - --label
          - "restore.test.backup={{ restore_selected_name }}"
          - --mount
          - "type=volume,src={{ restore_test_volume_name }},dst={{ restore_test_db_config.mount_target }}"
          - --env
          - "POSTGRES_USER={{ restore_test_db_config.postgres_user }}"
          - --env
          - "POSTGRES_DB={{ restore_test_db_config.postgres_db }}"
          - --env
          - >-
            POSTGRES_PASSWORD={{
              restore_test_db_config.postgres_password
            }}
          - --env
          - "PGDATA={{ restore_test_db_config.pgdata }}"
          - "{{ restore_test_db_config.image }}"
      register: restore_test_container_start
      changed_when: true
      no_log: true

    - name: Wait for isolated PostgreSQL readiness
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ restore_test_container_name }}"
          - pg_isready
          - -U
          - "{{ restore_test_db_config.postgres_user }}"
          - -d
          - "{{ restore_test_db_config.postgres_db }}"
      register: restore_test_pg_ready
      retries: "{{ restore_test_start_retries }}"
      delay: "{{ restore_test_start_delay }}"
      until: restore_test_pg_ready.rc == 0
      changed_when: false

    - name: Run isolated PostgreSQL identity and schema checks
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - --env
          - >-
            PGPASSWORD={{ restore_test_db_config.postgres_password }}
          - "{{ restore_test_container_name }}"
          - psql
          - --no-psqlrc
          - --username
          - "{{ restore_test_db_config.postgres_user }}"
          - --dbname
          - "{{ restore_test_db_config.postgres_db }}"
          - --tuples-only
          - --no-align
          - --field-separator
          - "|"
          - --command
          - >-
            SELECT
              current_database(),
              current_setting('server_version_num'),
              NOT pg_is_in_recovery(),
              to_regclass('public.documents_document') IS NOT NULL,
              to_regclass('public.django_migrations') IS NOT NULL;
      register: restore_test_db_identity
      changed_when: false
      no_log: true

    - name: Store PostgreSQL identity result
      ansible.builtin.set_fact:
        restore_test_db_identity_fields: >-
          {{ restore_test_db_identity.stdout.strip().split('|') }}

    - name: Require valid Paperless database structure
      ansible.builtin.assert:
        that:
          - restore_test_db_identity_fields | length == 5
          - >-
            restore_test_db_identity_fields[0] ==
            restore_test_db_config.postgres_db
          - restore_test_db_identity_fields[2] == "t"
          - restore_test_db_identity_fields[3] == "t"
          - restore_test_db_identity_fields[4] == "t"
        fail_msg: >-
          The restored PostgreSQL cluster started, but expected Paperless
          database structures were not found.

    - name: Count restored Paperless documents
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - --env
          - >-
            PGPASSWORD={{ restore_test_db_config.postgres_password }}
          - "{{ restore_test_container_name }}"
          - psql
          - --no-psqlrc
          - --username
          - "{{ restore_test_db_config.postgres_user }}"
          - --dbname
          - "{{ restore_test_db_config.postgres_db }}"
          - --tuples-only
          - --no-align
          - --command
          - "SELECT count(*) FROM public.documents_document;"
      register: restore_test_document_count
      changed_when: false
      no_log: true

    - name: Count restored Django migrations
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - --env
          - >-
            PGPASSWORD={{ restore_test_db_config.postgres_password }}
          - "{{ restore_test_container_name }}"
          - psql
          - --no-psqlrc
          - --username
          - "{{ restore_test_db_config.postgres_user }}"
          - --dbname
          - "{{ restore_test_db_config.postgres_db }}"
          - --tuples-only
          - --no-align
          - --command
          - "SELECT count(*) FROM public.django_migrations;"
      register: restore_test_migration_count
      changed_when: false
      no_log: true

    - name: Read restored database collation versions
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - --env
          - >-
            PGPASSWORD={{ restore_test_db_config.postgres_password }}
          - "{{ restore_test_container_name }}"
          - psql
          - --no-psqlrc
          - --username
          - "{{ restore_test_db_config.postgres_user }}"
          - --dbname
          - "{{ restore_test_db_config.postgres_db }}"
          - --tuples-only
          - --no-align
          - --field-separator
          - "|"
          - --command
          - >-
            SELECT
              COALESCE(datcollversion, '<none>'),
              COALESCE(
                pg_database_collation_actual_version(oid),
                '<none>'
              ),
              datcollversion IS NOT DISTINCT FROM
                pg_database_collation_actual_version(oid)
            FROM pg_database
            WHERE datname = current_database();
      register: restore_test_collation_raw
      changed_when: false
      no_log: true

    - name: Store restored database collation result
      ansible.builtin.set_fact:
        restore_test_collation_fields: >-
          {{ restore_test_collation_raw.stdout.strip().split('|') }}

    - name: Require readable database collation result
      ansible.builtin.assert:
        that:
          - restore_test_collation_fields | length == 3
          - restore_test_collation_fields[2] in ["t", "f"]
        fail_msg: >-
          The restored database collation versions could not be determined.

    - name: Display database collation mismatch warning
      ansible.builtin.debug:
        msg: >-
          WARNING: The restored database recorded collation version
          {{ restore_test_collation_fields[0] }}, while the current
          PostgreSQL image provides
          {{ restore_test_collation_fields[1] }}. Do not refresh the
          recorded version until affected collation-dependent objects
          have been reviewed and rebuilt.
      when: restore_test_collation_fields[2] != "t"

    - name: Store successful isolated restore test result
      ansible.builtin.set_fact:
        restore_test_summary:
          source: "{{ restore_selected_source }}"
          backup: "{{ restore_selected_name }}"
          database_service: "{{ restore_test_db_config.compose_service }}"
          database_image: "{{ restore_test_db_config.image }}"
          postgres_major: "{{ restore_test_archive_db.pg_version }}"
          readiness: "passed"
          sql_validation: "passed"
          document_count: "{{ restore_test_document_count.stdout | trim }}"
          migration_count: "{{ restore_test_migration_count.stdout | trim }}"
          collation_recorded: "{{ restore_test_collation_fields[0] }}"
          collation_actual: "{{ restore_test_collation_fields[1] }}"
          collation_status: >-
            {{
              "ok"
              if restore_test_collation_fields[2] == "t"
              else "warning"
            }}
          cleanup: "pending"

  rescue:
    - name: Capture isolated PostgreSQL logs after test failure
      ansible.builtin.command:
        argv:
          - docker
          - logs
          - --tail
          - "200"
          - "{{ restore_test_container_name }}"
      register: restore_test_failure_logs
      changed_when: false
      failed_when: false
      when: restore_test_container_name is defined

    - name: Display isolated PostgreSQL failure logs
      ansible.builtin.debug:
        var: restore_test_failure_logs.stdout_lines
      when:
        - restore_test_failure_logs is defined
        - restore_test_failure_logs.stdout_lines is defined

    - name: Fail isolated Paperless restore test
      ansible.builtin.fail:
        msg: >-
          The isolated Paperless restore test failed. Production containers,
          networks and volumes were not modified.

  always:
    - name: Remove isolated PostgreSQL test container
      ansible.builtin.command:
        argv:
          - docker
          - container
          - rm
          - --force
          - "{{ restore_test_container_name }}"
      register: restore_test_container_cleanup
      changed_when: restore_test_container_cleanup.rc == 0
      failed_when: false
      when: restore_test_container_name is defined

    - name: Remove isolated PostgreSQL test volume
      ansible.builtin.command:
        argv:
          - docker
          - volume
          - rm
          - --force
          - "{{ restore_test_volume_name }}"
      register: restore_test_volume_cleanup
      changed_when: restore_test_volume_cleanup.rc == 0
      failed_when: false
      when: restore_test_volume_name is defined

    - name: Remove isolated validation and extraction data
      ansible.builtin.file:
        path: "{{ restore_validation_temp.path }}"
        state: absent
      when: restore_validation_temp is defined

- name: Mark isolated test cleanup complete
  ansible.builtin.set_fact:
    restore_test_summary: >-
      {{
        restore_test_summary |
        combine({"cleanup": "completed"})
      }}
  when: restore_test_summary is defined
