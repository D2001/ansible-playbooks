# Generated by the docker_restore role for disaster-recovery drills.
# This file is not loaded by Docker Compose unless it is passed with:
# docker compose -f docker-compose.yml -f docker-compose.drill.yml up -d
services:
  paperless-ngx:
    restart: "no"
    # Keep Paperless reachable only through the drill proxy during restore drills.
    ports: !reset []
  db:
    restart: "no"
  redis:
    restart: "no"
  drill-proxy:
    image: nginx:1.27-alpine
    container_name: paperless-drill-proxy
    restart: "no"
    depends_on:
      - paperless-ngx
    command:
      - /bin/sh
      - -c
      - |
        cat >/etc/nginx/conf.d/default.conf <<'EOF'
        server {
          listen 80;
          location / {
            proxy_pass http://paperless-ngx:8000;
            proxy_set_header Host $$host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
          }
        }
        EOF
        nginx -g 'daemon off;'
    ports:
      - "8000:80"
    networks:
      - paperless
      - drill_access

networks:
  paperless:
    internal: true
  drill_access:
    driver: bridge
