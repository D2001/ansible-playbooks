---
- name: Verify service directory exists
  ansible.builtin.stat:
    path: "{{ service_dir }}"
  register: service_dir_stat

- name: Require service directory
  ansible.builtin.assert:
    that:
      - service_dir_stat.stat.exists
      - service_dir_stat.stat.isdir
    fail_msg: "Service directory does not exist: {{ service_dir }}"

- name: Verify Docker Compose file exists
  ansible.builtin.stat:
    path: "{{ compose_file }}"
  register: compose_file_stat

- name: Require Docker Compose file
  ansible.builtin.assert:
    that:
      - compose_file_stat.stat.exists
      - compose_file_stat.stat.isreg
    fail_msg: "Docker Compose file does not exist: {{ compose_file }}"

- name: Preflight sensitive restore files
  ansible.builtin.stat:
    path: "{{ service_dir }}/{{ item }}"
  loop: "{{ backup_sensitive_service_entries }}"
  register: sensitive_backup_entries

- name: Require sensitive files to be regular and private
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - (item.stat.mode | default('0000')) is regex('^0?[0-7]00$')
    fail_msg: >-
      Sensitive file {{ item.stat.path | default(item.item) }} must exist as a
      regular file and deny group/other permissions. Current mode is
      {{ item.stat.mode | default('unknown') }}.
  loop: "{{ sensitive_backup_entries.results | default([]) }}"
  when: backup_sensitive_service_entries | length > 0

# Remote destinations must not prevent creation of the local recovery copy.
- name: Ensure local backup directory exists
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: directory
    owner: karsten
    group: karsten
    mode: "0755"

- name: Remove stale incomplete local archives
  ansible.builtin.shell: |
    set -euo pipefail

    find "{{ backup_dir }}" \
      -maxdepth 1 \
      -type f \
      \( \
        -name "{{ service_name }}_backup_*.tar" \
        -o -name ".{{ service_name }}_backup_*.tar.gz.partial" \
        -o -name "{{ service_name }}_backup_*.tar.gz.partial" \
      \) \
      -print \
      -delete
  args:
    executable: /bin/bash
  register: stale_precleanup
  changed_when: stale_precleanup.stdout | length > 0

- name: Determine available local backup space
  ansible.builtin.shell: |
    set -euo pipefail
    df -Pm "{{ backup_dir }}" | awk 'NR == 2 {print $4}'
  args:
    executable: /bin/bash
  register: backup_free_mb
  changed_when: false

- name: Require sufficient local backup space
  ansible.builtin.assert:
    that:
      - (backup_free_mb.stdout | int) >= (min_free_space_mb | int)
    fail_msg: >-
      Only {{ backup_free_mb.stdout }} MB are available below
      {{ backup_dir }}. At least {{ min_free_space_mb }} MB are required.

- name: Read declared Docker Compose volumes
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - config
      - --volumes
  args:
    chdir: "{{ service_dir }}"
  register: declared_volumes_result
  changed_when: false

- name: Discover volumes actually mounted by this Compose project
  ansible.builtin.shell: |
    set -euo pipefail

    mapfile -t container_ids < <(
      docker ps -aq \
        --filter "label=com.docker.compose.project={{ service_name }}"
    )

    if [[ -z "${container_ids[0]-}" ]]; then
      exit 0
    fi

    docker inspect "${container_ids[@]}" |
      python3 -c '
    import json
    import sys

    containers = json.load(sys.stdin)
    names = {
        mount["Name"]
        for container in containers
        for mount in container.get("Mounts", [])
        if mount.get("Type") == "volume" and mount.get("Name")
    }

    sys.stdout.write("\n".join(sorted(names)))
    '
  args:
    executable: /bin/bash
  register: mounted_volumes_result
  changed_when: false

- name: Store declared and mounted volumes
  ansible.builtin.set_fact:
    declared_service_volumes: >-
      {{
        declared_volumes_result.stdout_lines
        | default([])
        | reject('equalto', '')
        | list
      }}
    service_volumes: >-
      {{
        mounted_volumes_result.stdout_lines
        | default([])
        | reject('equalto', '')
        | list
      }}

- name: Verify declared volumes were discovered
  ansible.builtin.assert:
    that:
      - >-
        declared_service_volumes | length == 0
        or service_volumes | length >= declared_service_volumes | length
    fail_msg: >-
      Docker Compose declares {{ declared_service_volumes | length }}
      active volume(s), but only {{ service_volumes | length }}
      mounted volume(s) were discovered. Backup aborted before stopping containers.

- name: Initialize backup status
  ansible.builtin.set_fact:
    docker_backup_failed: false
    docker_backup_error: ""
    backup_upload_completed: false
    backup_nas_upload_completed: false
    backup_onedrive_upload_completed: false

- name: Create Docker backup
  block:
    - name: Create temporary backup directory
      ansible.builtin.tempfile:
        state: directory
        suffix: "_{{ service_name }}_backup"
      register: temp_backup_dir

    - name: Install portable backup manifest helper
      ansible.builtin.copy:
        src: build_backup_manifest.py
        dest: "{{ temp_backup_dir.path }}/build_backup_manifest.py"
        mode: "0700"

    - name: Record portable service and mount manifest
      ansible.builtin.command:
        argv:
          - "{{ temp_backup_dir.path }}/build_backup_manifest.py"
          - --service-name
          - "{{ service_name }}"
          - --service-dir
          - "{{ service_dir }}"
          - --output
          - "{{ temp_backup_dir.path }}/backup-manifest.json"
      changed_when: true

    - name: Read portable backup manifest
      ansible.builtin.slurp:
        src: "{{ temp_backup_dir.path }}/backup-manifest.json"
      register: portable_backup_manifest_raw

    - name: Store portable backup manifest
      ansible.builtin.set_fact:
        portable_backup_manifest: >-
          {{ portable_backup_manifest_raw.content | b64decode | from_json }}

    - name: Stop service containers
      block:
        - name: Stop containers using Docker Compose module
          community.docker.docker_compose_v2:
            project_src: "{{ service_dir }}"
            state: absent

      rescue:
        - name: Stop containers using Docker Compose command
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - down
          args:
            chdir: "{{ service_dir }}"

    - name: Backup mounted Docker volumes
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - -v
          - "{{ item }}:/volume:ro"
          - -v
          - "{{ temp_backup_dir.path }}:/backup"
          - alpine:3.19
          - /bin/sh
          - -c
          - "tar czf /backup/{{ item }}.tar.gz -C /volume ."
      loop: "{{ service_volumes }}"
      loop_control:
        label: "{{ item }}"

    - name: Backup writable external bind mounts
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - -v
          - "{{ item.source }}:/source:ro"
          - -v
          - "{{ temp_backup_dir.path }}:/backup"
          - alpine:3.19
          - /bin/sh
          - -c
          - >-
            tar czf /backup/bind-{{ item.archive_id }}.tar.gz -C /source .
      loop: "{{ portable_backup_manifest.external_bind_mounts }}"
      loop_control:
        label: "{{ item.source }} -> {{ item.target }}"

    - name: Prepare final archive staging directory
      ansible.builtin.file:
        path: "{{ temp_backup_dir.path }}/archive-root"
        state: directory
        mode: "0755"

    - name: Stage portable backup manifest
      ansible.builtin.copy:
        src: "{{ temp_backup_dir.path }}/backup-manifest.json"
        dest: "{{ temp_backup_dir.path }}/archive-root/backup-manifest.json"
        remote_src: true
        mode: "0600"

    - name: Create and validate final compressed archive
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - -v
          - "{{ temp_backup_dir.path }}:/work"
          - -v
          - "{{ service_dir }}:/work/archive-root/{{ service_name }}:ro"
          - -v
          - "{{ backup_dir }}:/backup"
          - alpine:3.19
          - /bin/sh
          - -c
          - |
            set -eu
            set -o pipefail

            FINAL="/backup/{{ backup_file }}"
            PARTIAL="/backup/.{{ backup_file }}.partial"
            ARCHIVE_ROOT="/work/archive-root"
            ARCHIVE_LIST="/work/archive-list.txt"
            SERVICE_NAME="{{ service_name }}"
            BACKUP_OWNER="$(stat -c '%u:%g' /backup)"

            cleanup_workdir() {
              rm -rf "$ARCHIVE_ROOT/volumes"
              rm -rf "$ARCHIVE_ROOT/binds"
              rm -f "$ARCHIVE_LIST"
            }

            trap cleanup_workdir EXIT

            rm -f -- "$FINAL" "$PARTIAL" "$ARCHIVE_LIST"
            rm -rf "$ARCHIVE_ROOT/volumes"
            rm -rf "$ARCHIVE_ROOT/binds"
            mkdir -p "$ARCHIVE_ROOT/volumes"
            mkdir -p "$ARCHIVE_ROOT/binds"

            test -d "$ARCHIVE_ROOT/$SERVICE_NAME"
            test -f "$ARCHIVE_ROOT/$SERVICE_NAME/docker-compose.yml"
            {% for required_entry in backup_required_service_entries %}
            test -f "$ARCHIVE_ROOT/$SERVICE_NAME/{{ required_entry }}"
            {% endfor %}

            found_volume=0

            for volume_archive in /work/*.tar.gz; do
              [ -e "$volume_archive" ] || break

              case "$(basename "$volume_archive")" in
                bind-*) continue ;;
              esac

              found_volume=1
              volume_name="$(basename "$volume_archive" .tar.gz)"

              mkdir -p "$ARCHIVE_ROOT/volumes/$volume_name"

              tar -xzf "$volume_archive"                 -C "$ARCHIVE_ROOT/volumes/$volume_name"
            done

            found_bind=0

            for bind_archive in /work/bind-*.tar.gz; do
              [ -e "$bind_archive" ] || break

              found_bind=1
              bind_id="$(basename "$bind_archive" .tar.gz)"
              bind_id="${bind_id#bind-}"

              mkdir -p "$ARCHIVE_ROOT/binds/$bind_id"
              tar -xzf "$bind_archive" -C "$ARCHIVE_ROOT/binds/$bind_id"
            done

            set -- backup-manifest.json "$SERVICE_NAME"

            if [ "$found_volume" -eq 1 ]; then
              set -- "$@" volumes
            fi

            if [ "$found_bind" -eq 1 ]; then
              set -- "$@" binds
            fi

            tar -cf - -C "$ARCHIVE_ROOT" "$@" |
              gzip -1 > "$PARTIAL"

            gzip -t "$PARTIAL"
            tar -tzf "$PARTIAL" > "$ARCHIVE_LIST"

            grep -Fqx               "$SERVICE_NAME/docker-compose.yml"               "$ARCHIVE_LIST"
            grep -Fqx "backup-manifest.json" "$ARCHIVE_LIST"
            {% for required_entry in backup_required_service_entries %}
            grep -Fqx "$SERVICE_NAME/{{ required_entry }}" "$ARCHIVE_LIST"
            {% endfor %}

            if [ "$found_volume" -eq 1 ]; then
              for volume_dir in "$ARCHIVE_ROOT"/volumes/*; do
                [ -d "$volume_dir" ] || continue

                volume_name="$(basename "$volume_dir")"

                grep -Fqx                   "volumes/$volume_name/"                   "$ARCHIVE_LIST"
              done
            fi

            if [ "$found_bind" -eq 1 ]; then
              for bind_dir in "$ARCHIVE_ROOT"/binds/*; do
                [ -d "$bind_dir" ] || continue

                bind_id="$(basename "$bind_dir")"
                grep -Fqx "binds/$bind_id/" "$ARCHIVE_LIST"
              done
            fi

            test -s "$PARTIAL"

            mv -f -- "$PARTIAL" "$FINAL"
            chown "$BACKUP_OWNER" "$FINAL"
            chmod 0600 "$FINAL"

            echo "Created and validated: $FINAL"

    - name: Start service containers before uploads
      block:
        - name: Start containers using Docker Compose module
          community.docker.docker_compose_v2:
            project_src: "{{ service_dir }}"
            state: present
            wait: true
            wait_timeout: 180

      rescue:
        - name: Start containers using Docker Compose command
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - up
              - -d
              - --wait
              - --wait-timeout
              - "180"
          args:
            chdir: "{{ service_dir }}"

    - name: Upload and verify backup copies
      ansible.builtin.include_tasks: upload_backup.yml

    - name: Mark uploads successful
      ansible.builtin.set_fact:
        backup_upload_completed: true

  rescue:
    - name: Record backup failure
      ansible.builtin.set_fact:
        docker_backup_failed: true
        docker_backup_error: >-
          {{
            ansible_failed_result.stderr
            | default(
                ansible_failed_result.msg
                | default('Unknown backup error')
              )
          }}

  always:
    - name: Remove temporary backup directory
      ansible.builtin.file:
        path: "{{ temp_backup_dir.path }}"
        state: absent
      when:
        - temp_backup_dir is defined
        - temp_backup_dir.path is defined

    - name: Remove incomplete local archive artifacts
      ansible.builtin.shell: |
        find "{{ backup_dir }}" \
          -maxdepth 1 \
          -type f \
          \( \
            -name "{{ service_name }}_backup_*.tar" \
            -o -name ".{{ service_name }}_backup_*.tar.gz.partial" \
            -o -name "{{ service_name }}_backup_*.tar.gz.partial" \
          \) \
          -print \
          -delete
      args:
        executable: /bin/bash
      register: stale_postcleanup
      changed_when: stale_postcleanup.stdout | length > 0
      failed_when: false

    - name: Ensure service containers are running
      block:
        - name: Ensure containers are running using module
          community.docker.docker_compose_v2:
            project_src: "{{ service_dir }}"
            state: present
            wait: true
            wait_timeout: 180

      rescue:
        - name: Ensure containers are running using command
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - up
              - -d
              - --wait
              - --wait-timeout
              - "180"
          args:
            chdir: "{{ service_dir }}"

    - name: Apply backup retention
      ansible.builtin.include_tasks: cleanup_backups.yml

- name: Fail after containers and cleanup were handled
  ansible.builtin.fail:
    msg: "Backup of {{ service_name }} failed: {{ docker_backup_error }}"
  when: docker_backup_failed | bool
