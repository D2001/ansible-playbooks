---
- name: Initialize upload error list
  ansible.builtin.set_fact:
    backup_upload_errors: []

- name: Copy and verify backup on NAS
  block:
    - name: Copy backup atomically to NAS
      ansible.builtin.shell: |
        set -euo pipefail

        SOURCE="{{ backup_dir }}/{{ backup_file }}"
        TARGET="{{ nas_backup_dir }}/{{ backup_file }}"
        PARTIAL="{{ nas_backup_dir }}/.{{ backup_file }}.partial"

        rm -f -- "$PARTIAL"

        cp -- "$SOURCE" "$PARTIAL"

        mv -f -- "$PARTIAL" "$TARGET"
        chmod 0600 "$TARGET" || true

        LOCAL_SIZE="$(stat -c %s "$SOURCE")"
        NAS_SIZE="$(stat -c %s "$TARGET")"
        LOCAL_OWNER="$(stat -c %u:%g "$SOURCE")"
        NAS_OWNER="$(stat -c %u:%g "$TARGET")"
        NAS_MODE="$(stat -c %a "$TARGET")"
        NAS_OTHER="${NAS_MODE#${NAS_MODE%?}}"

        test "$LOCAL_SIZE" = "$NAS_SIZE"
        test "$LOCAL_OWNER" = "$NAS_OWNER"
        test "$NAS_OTHER" = "0"

        if [ "$NAS_MODE" != "600" ]; then
          echo "WARN: NAS mode is $NAS_MODE (expected 600). On CIFS with nounix/file_mode this can be normal as long as owner and other-bits are safe." >&2
        fi

        echo "NAS verified: $TARGET ($NAS_SIZE bytes, owner $NAS_OWNER, mode $NAS_MODE)"
      args:
        executable: /bin/bash

  rescue:
    - name: Record NAS upload error
      ansible.builtin.set_fact:
        backup_upload_errors: >-
          {{
            backup_upload_errors
            +
            [
              'NAS: '
              ~ (
                  ansible_failed_result.stderr
                  | default(
                      ansible_failed_result.msg
                      | default('unknown error')
                    )
                )
            ]
          }}

- name: Copy and verify backup on OneDrive
  block:
    - name: Upload backup to OneDrive
      ansible.builtin.shell: |
        set -euo pipefail

        SOURCE="{{ backup_dir }}/{{ backup_file }}"
        TARGET="{{ rclone_remote }}/{{ backup_file }}"

        rclone copyto \
          "$SOURCE" \
          "$TARGET" \
          --retries 3 \
          --low-level-retries 10 \
          --stats 30s \
          --stats-one-line

        LOCAL_SIZE="$(stat -c %s "$SOURCE")"

        REMOTE_SIZE="$(
          rclone lsl "$TARGET" |
          awk 'NR == 1 {print $1}'
        )"

        test -n "$REMOTE_SIZE"
        test "$LOCAL_SIZE" = "$REMOTE_SIZE"

        echo "OneDrive verified: $TARGET ($REMOTE_SIZE bytes)"
      args:
        executable: /bin/bash

  rescue:
    - name: Record OneDrive upload error
      ansible.builtin.set_fact:
        backup_upload_errors: >-
          {{
            backup_upload_errors
            +
            [
              'OneDrive: '
              ~ (
                  ansible_failed_result.stderr
                  | default(
                      ansible_failed_result.msg
                      | default('unknown error')
                    )
                )
            ]
          }}

- name: Fail when one or more backup copies failed
  ansible.builtin.fail:
    msg: "{{ backup_upload_errors | join('; ') }}"
  when: backup_upload_errors | length > 0
