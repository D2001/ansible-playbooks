---
- name: Keep configured number of local backups
  ansible.builtin.shell: |
    set -u

    cd "{{ backup_dir }}" || exit 0

    mapfile -t files < <(
      find . \
        -maxdepth 1 \
        -type f \
        -name "{{ backup_pattern }}" \
        -printf '%f\n' |
      sort -r
    )

    index=0
    for file in "${files[@]}"; do
      if (( index >= {{ max_local_backups }} )); then
        echo "Deleting local backup: $file"
        rm -f -- "$file"
      fi
      index=$((index + 1))
    done
  args:
    executable: /bin/bash
  register: local_cleanup
  changed_when: local_cleanup.stdout | length > 0
  failed_when: false

- name: Keep configured number of NAS backups
  ansible.builtin.shell: |
    set -u

    mountpoint -q "{{ nas_backup_dir | dirname }}" || exit 0
    cd "{{ nas_backup_dir }}" || exit 0

    mapfile -t files < <(
      find . \
        -maxdepth 1 \
        -type f \
        -name "{{ backup_pattern }}" \
        -printf '%f\n' |
      sort -r
    )

    index=0
    for file in "${files[@]}"; do
      if (( index >= {{ max_nas_backups }} )); then
        echo "Deleting NAS backup: $file"
        rm -f -- "$file"
      fi
      index=$((index + 1))
    done

    find . \
      -maxdepth 1 \
      -type f \
      -name ".{{ service_name }}_backup_*.tar.gz.partial" \
      -print \
      -delete
  args:
    executable: /bin/bash
  register: nas_cleanup
  changed_when: nas_cleanup.stdout | length > 0
  failed_when: false
  when:
    - backup_nas_upload_completed | default(false) | bool
    - backup_nas_enabled | bool

- name: Keep configured number of OneDrive backups
  ansible.builtin.shell: |
    set -u

    mapfile -t files < <(
      rclone lsf "{{ rclone_remote }}" --files-only 2>/dev/null |
      grep -E '^{{ service_name }}_backup_[0-9]{8}T[0-9]{6}\.tar\.gz$' |
      sort -r ||
      true
    )

    index=0
    for file in "${files[@]}"; do
      if (( index >= {{ max_onedrive_backups }} )); then
        echo "Deleting OneDrive backup: $file"
        rclone deletefile "{{ rclone_remote }}/$file"
      fi
      index=$((index + 1))
    done
  args:
    executable: /bin/bash
  register: onedrive_cleanup
  changed_when: onedrive_cleanup.stdout | length > 0
  failed_when: false
  when:
    - backup_onedrive_upload_completed | default(false) | bool
    - backup_onedrive_enabled | bool

- name: Display backup retention result
  ansible.builtin.debug:
    msg:
      service: "{{ service_name }}"
      local_keep: "{{ max_local_backups }}"
      nas_enabled: "{{ backup_nas_enabled | bool }}"
      nas_keep: "{{ max_nas_backups if (backup_nas_enabled | bool) else 'disabled' }}"
      onedrive_enabled: "{{ backup_onedrive_enabled | bool }}"
      onedrive_keep: "{{ max_onedrive_backups if (backup_onedrive_enabled | bool) else 'disabled' }}"
      uploads_completed: "{{ backup_upload_completed | default(false) }}"
      nas_upload_completed: "{{ backup_nas_upload_completed | default(false) }}"
      onedrive_upload_completed: "{{ backup_onedrive_upload_completed | default(false) }}"
      local_changed: "{{ local_cleanup.changed | default(false) }}"
      nas_changed: "{{ nas_cleanup.changed | default(false) }}"
      onedrive_changed: "{{ onedrive_cleanup.changed | default(false) }}"
