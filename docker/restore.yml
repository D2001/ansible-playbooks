---
- name: Validate Docker service restore backup
  hosts: localhost
  gather_facts: true

  vars:
    base_dir: "/home/karsten"
    backup_base_dir: "{{ base_dir }}/backups"

    service_name: "temp_service"
    service_dir: "{{ base_dir }}/{{ service_name }}"
    backup_dir: "{{ backup_base_dir }}/{{ service_name }}_backups"

    nas_backup_dir: "/mnt/backups/{{ service_name }}"
    rclone_remote: "onedrive:backups/{{ service_name }}_backups"
    backup_pattern: "{{ service_name }}_backup_*.tar.gz"

    # Only the non-destructive mode is currently enabled.
    restore_mode: "validate"

    # auto, local, nas or onedrive
    restore_source: "auto"

    # Optional explicit filename or local/NAS path.
    restore_file: ""

  pre_tasks:
    - name: Validate restore request
      ansible.builtin.assert:
        that:
          - service_name != "temp_service"
          - >-
            (service_name |
            regex_search('^[A-Za-z0-9][A-Za-z0-9_.-]*$')) is not none
          - restore_mode == "validate"
          - restore_source in ["auto", "local", "nas", "onedrive"]
        fail_msg: >-
          A valid service_name is required. Only restore_mode=validate is
          enabled while restore hardening is under development.

  tasks:
    - name: Run non-destructive restore validation
      ansible.builtin.import_role:
        name: docker_restore

  post_tasks:
    - name: Display restore validation summary
      ansible.builtin.debug:
        msg:
          mode: "{{ restore_mode }}"
          service: "{{ service_name }}"
          selected_source: "{{ restore_validation_summary.source }}"
          selected_backup: "{{ restore_validation_summary.backup }}"
          compressed_bytes: "{{ restore_validation_summary.compressed_bytes }}"
          unpacked_file_bytes: >-
            {{ restore_validation_summary.unpacked_file_bytes }}
          archive_members: "{{ restore_validation_summary.archive_members }}"
          volumes: "{{ restore_validation_summary.volumes }}"
          compose_validation: >-
            {{ restore_validation_summary.compose_validation }}
          temporary_data_retained: >-
            {{ restore_validation_summary.temporary_data_retained }}
          temporary_path: "{{ restore_validation_summary.temporary_path }}"
