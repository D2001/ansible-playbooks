---
- name: Validate or test Docker service restore backup
  hosts: localhost
  gather_facts: true

  vars:
    base_dir: "/home/karsten"
    backup_base_dir: "{{ base_dir }}/backups"

    service_name: "temp_service"
    service_dir: "{{ base_dir }}/{{ service_name }}"
    backup_dir: "{{ backup_base_dir }}/{{ service_name }}_backups"

    nas_backup_dir: "/mnt/backups/{{ service_name }}"
    rclone_remote: "onedrive:backups/{{ service_name }}_backups"
    backup_pattern: "{{ service_name }}_backup_*.tar.gz"

    # validate: archive-only verification
    # portable_test: generic isolated data reconstruction for manifest backups
    # test: isolated application-aware test; currently Paperless PostgreSQL only
    restore_mode: "validate"

    # auto, local, nas or onedrive
    restore_source: "auto"

    # Optional explicit filename or local/NAS path.
    restore_file: ""

  pre_tasks:
    - name: Validate restore request
      ansible.builtin.assert:
        that:
          - service_name != "temp_service"
          - >-
            (service_name |
            regex_search('^[A-Za-z0-9][A-Za-z0-9_.-]*$')) is not none
          - restore_mode in ["validate", "portable_test", "test"]
          - restore_source in ["auto", "local", "nas", "onedrive"]
          - restore_mode != "test" or service_name == "paperless"
        fail_msg: >-
          A valid service_name is required. restore_mode must be validate,
          portable_test or test. The application-aware test mode currently
          supports only Paperless.

  tasks:
    - name: Run hardened restore workflow
      ansible.builtin.import_role:
        name: docker_restore

  post_tasks:
    - name: Display restore validation summary
      ansible.builtin.debug:
        msg:
          mode: "{{ restore_mode }}"
          service: "{{ service_name }}"
          selected_source: "{{ restore_validation_summary.source }}"
          selected_backup: "{{ restore_validation_summary.backup }}"
          compressed_bytes: "{{ restore_validation_summary.compressed_bytes }}"
          unpacked_file_bytes: >-
            {{ restore_validation_summary.unpacked_file_bytes }}
          archive_members: "{{ restore_validation_summary.archive_members }}"
          volumes: "{{ restore_validation_summary.volumes }}"
          compose_validation: >-
            {{ restore_validation_summary.compose_validation }}
          temporary_data_retained: >-
            {{ restore_validation_summary.temporary_data_retained }}
          temporary_path: "{{ restore_validation_summary.temporary_path }}"
      when: restore_mode == "validate"

    - name: Display isolated restore test summary
      ansible.builtin.debug:
        msg:
          mode: "{{ restore_mode }}"
          service: "{{ service_name }}"
          selected_source: "{{ restore_test_summary.source }}"
          selected_backup: "{{ restore_test_summary.backup }}"
          database_service: "{{ restore_test_summary.database_service }}"
          database_image: "{{ restore_test_summary.database_image }}"
          postgres_major: "{{ restore_test_summary.postgres_major }}"
          readiness: "{{ restore_test_summary.readiness }}"
          sql_validation: "{{ restore_test_summary.sql_validation }}"
          documents: "{{ restore_test_summary.document_count }}"
          migrations: "{{ restore_test_summary.migration_count }}"
          collation_recorded: >-
            {{ restore_test_summary.collation_recorded }}
          collation_actual: >-
            {{ restore_test_summary.collation_actual }}
          collation_status: >-
            {{ restore_test_summary.collation_status }}
          production_containers_touched: false
          production_volumes_touched: false
          cleanup: "{{ restore_test_summary.cleanup }}"
      when: restore_mode == "test"

    - name: Display generic portable restore test summary
      ansible.builtin.debug:
        msg:
          mode: "{{ restore_mode }}"
          service: "{{ service_name }}"
          selected_source: "{{ portable_restore_test_summary.source }}"
          selected_backup: "{{ portable_restore_test_summary.backup }}"
          service_files: "{{ portable_restore_test_summary.service_files }}"
          named_volumes: "{{ portable_restore_test_summary.named_volumes }}"
          portable_binds: "{{ portable_restore_test_summary.portable_binds }}"
          external_binds: "{{ portable_restore_test_summary.external_binds }}"
          runtime_requirements: >-
            {{ portable_restore_test_summary.runtime_requirements }}
          production_containers_touched: false
          production_volumes_touched: false
          cleanup: "{{ portable_restore_test_summary.cleanup }}"
      when: restore_mode == "portable_test"
