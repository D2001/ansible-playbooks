x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:

  prometheus:
    logging: *default-logging
    image: prom/prometheus:latest
    container_name: monitoring-prometheus
    restart: unless-stopped
    network_mode: host
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=14d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    logging: *default-logging
    image: grafana/grafana:latest
    container_name: monitoring-grafana
    restart: unless-stopped
    network_mode: host
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  node-exporter:
    logging: *default-logging
    image: prom/node-exporter:latest
    container_name: monitoring-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - '--path.rootfs=/host'
      - '--collector.textfile.directory=/textfile'
    volumes:
      - /:/host:ro,rslave
      - ./textfile:/textfile:ro

  blackbox-exporter:
    logging: *default-logging
    image: prom/blackbox-exporter:latest
    container_name: monitoring-blackbox
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./blackbox/blackbox.yml:/config/blackbox.yml:ro
    command:
      - '--config.file=/config/blackbox.yml'


  fritz-exporter:
    logging: *default-logging
    image: pdreker/fritz_exporter:3
    container_name: monitoring-fritz-exporter
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./secrets/fritz-exporter.env



  snmp-exporter:
    logging: *default-logging
    image: prom/snmp-exporter:latest
    container_name: monitoring-snmp-exporter
    restart: unless-stopped
    network_mode: host
    command:
      - '--config.file=/etc/snmp_exporter/snmp.yml'
      - '--web.listen-address=127.0.0.1:9116'
    volumes:
      - ./snmp/snmp.yml:/etc/snmp_exporter/snmp.yml:ro

  home-dashboard:
    logging: *default-logging
    build:
      context: ./home-dashboard
    container_name: monitoring-home-dashboard
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./home-dashboard/data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
