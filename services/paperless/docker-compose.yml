x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  paperless-ngx:
    logging: *default-logging
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless-ngx
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    volumes:
      - paperless_data:/usr/src/paperless/data
      - paperless_media:/usr/src/paperless/media
      - type: bind
        source: /mnt/paperless/export
        target: /usr/src/paperless/export
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/paperless/consume
        target: /usr/src/paperless/consume
        bind:
          create_host_path: false
      - ./custom-scripts:/usr/src/paperless/custom-scripts:ro
    environment:
      - PAPERLESS_DBHOST=db
      - PAPERLESS_CONSUMER_POLLING=1
      - PAPERLESS_REDIS=redis://redis:6379
      - PAPERLESS_TIME_ZONE=Europe/Berlin
      - PAPERLESS_CONSUMPTION_DIR=/usr/src/paperless/consume
      - PAPERLESS_EXPORT_DIR=/usr/src/paperless/export
      - PAPERLESS_OCR_LANGUAGE=deu
      - PAPERLESS_FILENAME_FORMAT={{ created_year }}-{{ created_month }}-{{ created_day }}_{{ original_filename }}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - paperless

  db:
    logging: *default-logging
    image: postgres:16
    container_name: paperless-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PAPERLESS_DBNAME}
      POSTGRES_USER: ${PAPERLESS_DBUSER}
      POSTGRES_PASSWORD: ${PAPERLESS_DBPASS}
    volumes:
      - paperless_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAPERLESS_DBUSER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - paperless

  redis:
    logging: *default-logging
    image: redis:7
    container_name: paperless-redis
    restart: unless-stopped
    volumes:
      - paperless_redis:/data
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - paperless

volumes:
  paperless_data:
  paperless_media:
  paperless_export:
  paperless_pgdata:
  paperless_redis:

networks:
  paperless:
    driver: bridge